<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Query Builder</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Query Builder</h1>
        <p>Build a filter against the example backend, then run it.</p>
      </header>

      <section id="builder-mount" class="builder-card" aria-label="Query builder"></section>

      <section class="output-card">
        <h2>Serialized query</h2>
        <pre id="dsl-output" class="dsl-output"></pre>
        <ul id="issues-output" class="issues" hidden></ul>
        <button id="run-query" type="button" disabled>Run query</button>
      </section>

      <section class="output-card">
        <h2>Results</h2>
        <pre id="results-output" class="results-output"></pre>
      </section>
    </main>

    <script type="module" src="/dist/app/main.js"></script>
  </body>
</html>
